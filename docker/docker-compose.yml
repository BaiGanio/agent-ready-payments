services:
  payments-postgres:
    image: pgvector/pgvector:pg17
    container_name: payments-postgres
    environment:
      POSTGRES_USER: labs
      POSTGRES_PASSWORD: labs
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - payments-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labs -d postgres"]   # the pg_isready command, as a list
      interval: 5s
      timeout: 5s
      retries: 10

  payments-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: payments-mssql
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - payments-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\""]   # the sqlcmd command, as a list
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  payments-postgres-data:
  payments-mssql-data: